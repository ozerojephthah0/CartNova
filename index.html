    <script>
      // Clean up benign preview iframe websocket reconnection noise in dev environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
