<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cartnova-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="50%" stop-color="#fb7701" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="sparkle-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#cartnova-bg)" filter="url(#glow)" />
  
  <!-- Subtle Highlight Curve -->
  <path d="M 8,36 C 8,20 20,8 36,8 L 92,8 C 108,8 120,20 120,36 C 120,40 116,46 100,44 C 70,40 40,46 16,58 C 10,54 8,44 8,36 Z" fill="#ffffff" fill-opacity="0.15" />

  <!-- Shopping Cart Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cart Handle & Basket -->
    <path d="M 28 36 L 40 36 L 52 74 L 92 74 L 102 46 L 45 46" />
    <!-- Wheels -->
    <circle cx="55" cy="88" r="4.5" fill="#ffffff" stroke="none" />
    <circle cx="89" cy="88" r="4.5" fill="#ffffff" stroke="none" />
  </g>

  <!-- Golden Sparkle Accent -->
  <path d="M 94 20 L 97 28 L 105 31 L 97 34 L 94 42 L 91 34 L 83 31 L 91 28 Z" fill="url(#sparkle-gold)" stroke="#d97706" stroke-width="1" />
  <circle cx="78" cy="24" r="2" fill="#fff59d" />
</svg>
